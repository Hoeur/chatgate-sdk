name: Publish npm packages

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js and npm
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: npm run release:check

      - name: Test SDK packages
        run: npm test

      - name: Type-check SDK packages
        run: npm run typecheck

      - name: Verify package contents
        run: npm run pack:check

      - name: Publish packages not already on npm
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          packages=(
            "@chatgate/core"
            "@chatgate/react"
            "@chatgate/vue"
            "@chatgate/react-native"
          )

          for package in "${packages[@]}"; do
            if npm view "${package}@${version}" version >/dev/null 2>&1; then
              echo "Skipping ${package}@${version}; it is already published."
              continue
            fi

            npm publish --workspace "${package}" --access public
          done
